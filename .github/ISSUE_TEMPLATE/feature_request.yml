name: Feature request
description: Something the library should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the API you have in mind for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Including "shell out to tmux directly", which is a fair answer.
  - type: input
    id: python-parity
    attributes:
      label: Does Python libtmux do this?
      description: If so, name the symbol — parity is tracked and that shortens the discussion.
